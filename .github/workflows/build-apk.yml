name: Build Earth Dictionary APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-36" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Fetch NLLB-enabled native engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .llama
          git clone --depth 1 https://github.com/drizzt/llama.cpp.git .llama

      - name: Download compact offline NLLB model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/nllb-model
          mkdir -p .build/nllb-model app/src/main/assets/models
          MODEL_URL="https://huggingface.co/Hosstia/nllb-200-distilled-600m-gguf/resolve/main/nllb-600m-Q4_0.gguf?download=true"
          MODEL_FILE=".build/nllb-model/nllb-600m-Q4_0.gguf"
          echo "Downloading $MODEL_URL"
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 -o "$MODEL_FILE" "$MODEL_URL"
          test "$(stat -c %s "$MODEL_FILE")" -gt 450000000
          cp "$MODEL_FILE" app/src/main/assets/models/nllb-q4.gguf
          stat -c 'Embedded NLLB model: %s bytes' app/src/main/assets/models/nllb-q4.gguf

      - name: Verify NLLB model with native reference build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .llama -B .build/llama-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF
          cmake --build .build/llama-host --target llama-nllb -j2
          .build/llama-host/bin/llama-nllb \
            -m app/src/main/assets/models/nllb-q4.gguf \
            -p 'Hello, how are you?' \
            -sl eng_Latn \
            -tl fra_Latn \
            -n 32

      - name: Package web UI into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/web
          mkdir -p app/src/main/assets/web
          cp -R web/dist/. app/src/main/assets/web/

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Report APK size
        shell: bash
        run: |
          set -euo pipefail
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earth-Dictionary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
