name: Build Earth Dictionary APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-36" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Fetch NLLB-enabled native engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .llama
          git clone --depth 1 https://github.com/drizzt/llama.cpp.git .llama

      - name: Download embedded NLLB Q4_K_M model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/nllb-model
          mkdir -p .build/nllb-model app/src/main/assets/models
          python3 -m pip install --disable-pip-version-check -q -U huggingface_hub
          export HF_HUB_DISABLE_XET=1
          export HF_HUB_DISABLE_UPDATE_CHECK=1
          python3 - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          repo_id = "keisuke-miyako/nllb-200-distilled-600M-gguf-q4_k_m"
          filename = "nllb-200-distilled-600M-q4_k_m.gguf"
          target_dir = Path(".build/nllb-model")
          target_dir.mkdir(parents=True, exist_ok=True)
          path = hf_hub_download(
              repo_id=repo_id,
              filename=filename,
              repo_type="model",
              revision="main",
              local_dir=str(target_dir),
              force_download=True,
          )
          print(f"Downloaded NLLB Q4_K_M: {path}")
          PY
          MODEL_FILE=".build/nllb-model/nllb-200-distilled-600M-q4_k_m.gguf"
          test -f "$MODEL_FILE"
          MODEL_SIZE="$(stat -c %s "$MODEL_FILE")"
          test "$MODEL_SIZE" -gt 700000000
          cp "$MODEL_FILE" app/src/main/assets/models/nllb-q4.gguf
          stat -c 'Embedded NLLB Q4_K_M model: %s bytes' app/src/main/assets/models/nllb-q4.gguf

      - name: Verify NLLB model with native reference build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .llama -B .build/llama-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF
          cmake --build .build/llama-host --target llama-nllb -j2
          .build/llama-host/bin/llama-nllb \
            -m app/src/main/assets/models/nllb-q4.gguf \
            -p 'Hello, how are you?' \
            -sl eng_Latn \
            -tl fra_Latn \
            -n 32

      - name: Package web UI into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/web
          mkdir -p app/src/main/assets/web
          cp -R web/dist/. app/src/main/assets/web/

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Report APK size
        shell: bash
        run: |
          set -euo pipefail
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earth-Dictionary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
