name: Build Earth Dictionary APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platforms;android-36" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build web UI
        working-directory: web
        run: npm run build

      - name: Fetch minimal M2M100 native engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .crispasr
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/CrispStrobe/CrispASR.git .crispasr
          test -f .crispasr/src/m2m100.cpp
          test -f .crispasr/src/m2m100.h
          test -f .crispasr/src/core/gguf_loader.cpp
          test -f .crispasr/ggml/CMakeLists.txt

      - name: Download embedded M2M100 Q4_K model
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build/m2m-model
          mkdir -p .build/m2m-model app/src/main/assets/models
          python3 -m pip install --disable-pip-version-check -q -U huggingface_hub
          export HF_HUB_DISABLE_XET=1
          export HF_HUB_DISABLE_UPDATE_CHECK=1
          python3 - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          repo_id = "cstr/m2m100-418m-GGUF"
          filename = "m2m100-418m-q4_k.gguf"
          target_dir = Path(".build/m2m-model")
          target_dir.mkdir(parents=True, exist_ok=True)
          path = hf_hub_download(
              repo_id=repo_id,
              filename=filename,
              repo_type="model",
              revision="main",
              local_dir=str(target_dir),
              force_download=True,
          )
          print(f"Downloaded M2M100 Q4_K: {path}")
          PY
          MODEL_FILE=".build/m2m-model/m2m100-418m-q4_k.gguf"
          test -f "$MODEL_FILE"
          MODEL_SIZE="$(stat -c %s "$MODEL_FILE")"
          test "$MODEL_SIZE" -gt 250000000
          test "$MODEL_SIZE" -lt 310000000
          cp "$MODEL_FILE" app/src/main/assets/models/m2m100-q4k.gguf
          stat -c 'Embedded M2M100 Q4_K model: %s bytes' app/src/main/assets/models/m2m100-q4k.gguf
      - name: Download embedded offline OCR data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata
          for lang in eng fas ara aze heb urd; do
            curl -L --fail --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${lang}.traineddata" \
              -o "app/src/main/assets/tessdata/${lang}.traineddata"
            test -s "app/src/main/assets/tessdata/${lang}.traineddata"
          done
          du -h app/src/main/assets/tessdata/*.traineddata


      - name: Verify M2M100 model with native smoke test
        shell: bash
        run: |
          set -euo pipefail
          cmake -S app/src/main/cpp -B .build/m2m-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DCRISPASR_SRC_DIR="${GITHUB_WORKSPACE}/.crispasr" \
            -DEARTH_M2M_HOST_TEST=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF
          cmake --build .build/m2m-host --target earthm2m-smoke -j2
          .build/m2m-host/earthm2m-smoke app/src/main/assets/models/m2m100-q4k.gguf

      - name: Package web UI into Android assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/web
          mkdir -p app/src/main/assets/web
          cp -R web/dist/. app/src/main/assets/web/

      - name: Build universal installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify universal APK ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libearthm2m.so'
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libearthm2m.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libearthm2m.so'
          echo "Universal APK ABIs: arm64-v8a, armeabi-v7a, x86_64"

      - name: Report APK size
        shell: bash
        run: |
          set -euo pipefail
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earth-Dictionary-universal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
