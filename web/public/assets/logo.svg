<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </radialGradient>
    <linearGradient id="ocean" x1="95" y1="80" x2="410" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#53cdf7"/>
      <stop offset="0.55" stop-color="#1598e7"/>
      <stop offset="1" stop-color="#1559d0"/>
    </linearGradient>
    <linearGradient id="green" x1="90" y1="95" x2="410" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b2ee60"/>
      <stop offset="0.55" stop-color="#66cb4f"/>
      <stop offset="1" stop-color="#2f9b55"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f4c81" flood-opacity=".18"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#paper)"/>
  <circle cx="256" cy="256" r="245" fill="none" stroke="#d9ecfa" stroke-width="3"/>

  <!-- central globe -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="274" r="122" fill="url(#ocean)"/>
    <path d="M162 200c24-42 60-60 97-56 18 2 28 11 24 22-5 15-27 23-39 39-13 18-13 39-30 49-17 10-41 5-57-12-8-9-5-25 5-42Z" fill="url(#green)"/>
    <path d="M287 270c24-17 50-19 79-5-10 32-29 57-57 73-27 17-58 22-84 15-7-16-1-32 12-43 14-10 32-14 53-26 12-7 16-10 27-14Z" fill="url(#green)"/>
    <path d="M302 327c25-7 48 0 68 17-18 20-41 34-66 39-15 3-30 3-45 0 11-23 22-43 43-56Z" fill="#3aa15a"/>
    <path d="M202 156c-19 31-27 69-26 106 1 45 18 82 50 113" fill="none" stroke="#dff8ff" stroke-width="8" stroke-linecap="round" opacity=".62"/>
    <path d="M326 165c21 31 31 67 31 108 0 34-9 69-27 99" fill="none" stroke="#dff8ff" stroke-width="8" stroke-linecap="round" opacity=".52"/>
    <path d="M134 274h244" fill="none" stroke="#dff8ff" stroke-width="8" stroke-linecap="round" opacity=".42"/>
    <path d="M174 352c45 20 100 28 159 24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".32"/>
    <circle cx="256" cy="274" r="122" fill="none" stroke="#0e63b4" stroke-opacity=".22" stroke-width="4"/>
  </g>

  <!-- speech bubbles -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" text-anchor="middle">
    <g>
      <rect x="117" y="61" width="146" height="64" rx="26" fill="#2f8ded"/>
      <path d="M171 124l-12 28 36-26Z" fill="#2f8ded"/>
      <text x="190" y="103" font-size="32" fill="#fff">Hello</text>
    </g>
    <g>
      <rect x="281" y="55" width="137" height="64" rx="25" fill="#ffb916"/>
      <path d="M333 117l2 28 24-27Z" fill="#ffb916"/>
      <text x="350" y="97" font-size="31" fill="#fff">Hola</text>
    </g>
    <g>
      <rect x="353" y="141" width="127" height="69" rx="27" fill="#7650d9"/>
      <path d="M414 205l-7 27 27-26Z" fill="#7650d9"/>
      <text x="417" y="184" font-size="29" fill="#fff">你好</text>
    </g>
    <g>
      <rect x="360" y="222" width="125" height="68" rx="27" fill="#31ad64"/>
      <path d="M394 286l-6 27 28-25Z" fill="#31ad64"/>
      <text x="423" y="264" font-size="27" fill="#fff">مرحبا</text>
    </g>
    <g>
      <rect x="342" y="344" width="132" height="67" rx="26" fill="#ef4058"/>
      <path d="M373 406l-6 26 31-25Z" fill="#ef4058"/>
      <text x="408" y="384" font-size="28" fill="#fff">Привет</text>
    </g>
    <g>
      <rect x="190" y="413" width="152" height="63" rx="25" fill="#18acc2"/>
      <path d="M252 474l-5 25 29-25Z" fill="#18acc2"/>
      <text x="266" y="452" font-size="29" fill="#fff">Bonjour</text>
    </g>
    <g>
      <rect x="45" y="362" width="150" height="67" rx="26" fill="#ef3e91"/>
      <path d="M103 425l-5 27 29-26Z" fill="#ef3e91"/>
      <text x="120" y="402" font-size="26" fill="#fff">こんにちは</text>
    </g>
    <g>
      <rect x="33" y="236" width="138" height="68" rx="26" fill="#ff8c1b"/>
      <path d="M83 299l-3 28 28-27Z" fill="#ff8c1b"/>
      <text x="103" y="278" font-size="28" fill="#fff">नमस्ते</text>
    </g>
    <g>
      <rect x="42" y="150" width="122" height="66" rx="26" fill="#8b68d9"/>
      <path d="M91 211l-4 26 28-24Z" fill="#8b68d9"/>
      <text x="103" y="191" font-size="27" fill="#fff">Hallo</text>
    </g>
  </g>

  <!-- orbit accents -->
  <path d="M83 319C128 354 173 378 226 389" fill="none" stroke="#8ecdf6" stroke-width="8" stroke-linecap="round"/>
  <path d="M294 123c54 23 92 51 126 86" fill="none" stroke="#8ecdf6" stroke-width="8" stroke-linecap="round"/>
  <path d="M337 315c32-10 61-24 86-43" fill="none" stroke="#8ecdf6" stroke-width="8" stroke-linecap="round"/>
